<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دائري مصر 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d1a;--fg:#fff;--ac:#e0213a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d1a;--fg:#fff}}
:root[data-theme="dark"]{--bg:#0b0d1a;--fg:#fff}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Tajawal,system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
button{-webkit-tap-highlight-color:transparent}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:calc(env(safe-area-inset-left,0px) + 14px);right:calc(env(safe-area-inset-right,0px) + 14px);display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;text-shadow:0 2px 6px #000;direction:ltr;z-index:3}
#spd b{font-size:44px;font-weight:900;line-height:1}#spd small{font-size:14px;margin-left:5px}
#sbar{width:150px;height:6px;background:rgba(255,255,255,.2);border-radius:3px;margin-top:4px;overflow:hidden}#sbar i{display:block;height:100%;width:0;background:#ffd24a}
#sc{font-size:15px;text-align:right}#sc b{font-size:20px}
#ctl{position:fixed;left:calc(env(safe-area-inset-left,0px) + 16px);right:calc(env(safe-area-inset-right,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;justify-content:space-between;align-items:flex-end;direction:ltr;z-index:4}
.grp{display:flex;gap:14px;align-items:flex-end}.col{flex-direction:column;align-items:flex-start;gap:10px}
#ctl button{font:900 22px Tajawal,sans-serif;color:#fff;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.4);border-radius:18px;backdrop-filter:blur(4px);position:relative;overflow:hidden}
#bl,#br{width:92px;height:84px;font-size:34px!important}
#bg{width:110px;height:84px;background:rgba(60,200,90,.35)!important}#bb{width:86px;height:84px;background:rgba(224,33,58,.38)!important}
#bt{width:206px;height:52px}#bt i{position:absolute;left:0;top:0;bottom:0;width:100%;background:rgba(80,160,255,.55);transform-origin:left;z-index:0}#bt span{position:relative;z-index:1}
#bt.ready{border-color:#6cf;box-shadow:0 0 14px #4af}#bt.act{border-color:#fc4;box-shadow:0 0 20px #f80}
#ctl button.on{background:rgba(255,255,255,.4)}
#ov{z-index:6;position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(8,10,24,.72);text-align:center;padding:16px}
#ov h1{font-size:32px;margin:0;font-weight:900}#ov p{margin:0;font-size:16px;line-height:1.6;max-width:520px}
#cars{display:flex;gap:8px;overflow-x:auto;max-width:94vw;padding:4px;touch-action:pan-x;direction:rtl}
.card{flex:0 0 auto;min-width:104px;height:92px;border-radius:14px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font:700 13px Tajawal,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px}
.card.sel{border-color:#ffd24a;background:rgba(255,210,74,.22)}
.card img{height:50px;object-fit:contain}.card i{width:46px;height:26px;border-radius:12px 12px 6px 6px;border:2px solid #fff}
#ov h1{font-size:26px!important}#ov{gap:6px!important}
#go{font:900 22px Tajawal,sans-serif;color:#fff;background:var(--ac);border:0;border-radius:40px;padding:10px 44px}
#pbar{width:130px;height:6px;background:rgba(255,255,255,.2);border-radius:3px;margin:4px 0 0 auto;overflow:hidden}#pbar i{display:block;height:100%;width:0;background:#4fe08a}
#routes{display:flex;gap:8px}.card.rt{height:auto;min-height:56px;min-width:170px;font-size:15px;padding:6px 10px}.card.rt small{font-weight:400;font-size:11px;opacity:.85}.lb{font-size:14px;font-weight:700;opacity:.9}
#ov{overflow:auto}
#sg{display:flex;gap:6px;direction:ltr}.rc{align-items:flex-end!important;gap:8px!important}
#sg button{font:900 20px Tajawal,sans-serif;color:#fff;background:rgba(255,150,20,.22);border:2px solid #ff9a1a;border-radius:12px;height:34px;min-width:44px;padding:0 8px;font-size:15px!important}#sg #sh{font-size:12px!important}
#sg button.act{background:rgba(255,150,20,.5)}#sg button.blink{background:#ff9a1a;box-shadow:0 0 18px #ff9a1a}
#ctl button{transition:transform .06s,background .06s}#ctl button.on{transform:scale(.92)}#bb.on{background:#e0213a!important;border-color:#fff!important}#bg.on{background:#2fcf5a!important;border-color:#fff!important}#bt.on{border-color:#fff!important}#bl.on,#br.on{background:#5aa0ff!important;border-color:#fff!important}
#mn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);z-index:5;display:none;font:700 14px Tajawal,sans-serif;color:#fff;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.45);border-radius:20px;padding:6px 14px}
#rs{display:none;font:900 22px Tajawal,sans-serif;color:#fff;background:#2a9d4e;border:0;border-radius:40px;padding:10px 34px}
#ov{touch-action:pan-y!important;overflow-y:auto;-webkit-overflow-scrolling:touch;justify-content:flex-start!important;padding:12px 8px calc(env(safe-area-inset-bottom,0px) + 12px)!important}
#ov::before,#ov::after{content:'';margin:auto}
#cars{flex-wrap:wrap;justify-content:center;overflow:visible!important;touch-action:auto!important}
#routes{flex-wrap:wrap;justify-content:center}
#ab{display:flex;gap:12px;position:sticky;bottom:6px;z-index:2;background:rgba(8,10,24,.85);padding:6px 16px;border-radius:34px}
#bal{font-size:20px;font-weight:900;color:#ffd24a;text-shadow:0 2px 6px #000}#buy{display:none;font:900 17px Tajawal,sans-serif;color:#fff;background:#d6881a;border:0;border-radius:40px;padding:10px 22px}#buy.dis{background:#555}.card{height:auto!important;min-height:104px}.card.locked{opacity:.8}.card .pr{font-size:12px;color:#ffd24a;font-weight:900}
#sw{width:124px;height:124px;touch-action:none}#sw svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 8px rgba(0,0,0,.7));pointer-events:none}@media (orientation:portrait){#sw{width:100px;height:100px}}
#rot{display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);z-index:7;background:rgba(0,0,0,.6);padding:4px 12px;border-radius:14px;font-size:13px;pointer-events:none;white-space:nowrap}
@media (orientation:portrait){#rot{display:block}#mn{top:calc(env(safe-area-inset-top,0px) + 40px)!important}#bl,#br{width:70px!important}#bg{width:80px!important}#bb{width:64px!important}#bt{width:146px!important}#ctl{left:8px;right:8px}.grp{gap:8px}}
#tb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:6px}
#tb #mn{position:static!important;transform:none!important;top:auto!important;left:auto!important}
#mu{font:700 15px Tajawal,sans-serif;color:#fff;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.45);border-radius:20px;padding:4px 12px}
@media (orientation:portrait){#tb{top:calc(env(safe-area-inset-top,0px) + 40px)!important}}
#ctrls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
body.mw #arrows{display:none!important}body.mb #sw{display:none!important}
#ctl{bottom:calc(env(safe-area-inset-bottom,0px) + 8px)}
#bl,#br{width:58px!important;height:54px!important;font-size:22px!important;border-radius:14px!important}
#bg{width:74px!important;height:54px!important;font-size:15px!important;border-radius:14px!important}
#bb{width:62px!important;height:54px!important;font-size:14px!important;border-radius:14px!important}
#bt{width:136px!important;height:36px!important;font-size:13px!important;border-radius:12px!important}
#sw{width:92px!important;height:92px!important}
#sg button{height:30px!important;min-width:40px!important;font-size:13px!important}#sg #sh{font-size:11px!important}
.col{gap:6px!important}.rc{gap:6px!important}
#gr{font-size:12px;margin-left:8px;padding:1px 8px;border-radius:10px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.35);vertical-align:middle}#gr b{font-size:15px;color:#ffd24a}
#cr{width:46px!important;height:36px!important;font-size:12px!important;border-radius:12px!important}#cr.act{background:#2fcf5a!important;border-color:#fff!important}
#tmode{display:flex;gap:8px}
#ov .card .sp{font-size:11px;color:#9fe3ff;font-weight:700}
#pxs{font-size:13px;margin-top:3px}
#note{position:fixed;top:calc(env(safe-area-inset-top,0px) + 46px);left:50%;transform:translateX(-50%);z-index:4;pointer-events:none;display:flex;flex-direction:column;gap:4px;align-items:center;font-weight:900;font-size:14px;text-shadow:0 2px 6px #000;white-space:nowrap}
#note div{background:rgba(0,0,0,.55);border-radius:14px;padding:3px 12px}#note div.stp{background:#d6881a}
#toast{position:fixed;top:34%;left:50%;transform:translateX(-50%);z-index:5;pointer-events:none;font-size:20px;font-weight:900;text-shadow:0 2px 8px #000;opacity:0;transition:opacity .25s;background:rgba(0,0,0,.5);padding:4px 16px;border-radius:16px}
@media (orientation:portrait){#note{top:calc(env(safe-area-inset-top,0px) + 76px)}}
#rad{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 112px);z-index:4;pointer-events:none;font-weight:900;font-size:13px;text-shadow:0 2px 6px #000;text-align:right}
#rad div{background:rgba(20,87,168,.75);border-radius:12px;padding:3px 10px;border:2px solid #fff}#rad div.warn{background:#c0282d}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:8;transition:opacity .35s}
#radmsg{position:fixed;top:calc(env(safe-area-inset-top,0px) + 44px);left:50%;transform:translateX(-50%);z-index:5;pointer-events:none;font-weight:900;font-size:13px;background:#c0282d;border:2px solid #fff;border-radius:12px;padding:2px 12px;text-shadow:0 1px 3px #000;opacity:0;transition:opacity .3s;white-space:nowrap}
#note{top:calc(env(safe-area-inset-top,0px) + 78px)!important}
@media (orientation:portrait){#radmsg{top:calc(env(safe-area-inset-top,0px) + 76px)}#note{top:calc(env(safe-area-inset-top,0px) + 110px)!important}}
